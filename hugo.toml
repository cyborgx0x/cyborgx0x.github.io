baseURL = "https://cyborgx0x.github.io/"
languageCode = "vi-vn"
defaultContentLanguage = "vi"
title = "Ghi chú & Nghiên cứu"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Tuyển tập ghi chú tri thức và nghiên cứu chọn lọc, chia sẻ công khai."
  author = "cyborgx0x"
  defaultTheme = "auto"
  ShowShareButtons = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = false
  displayFullLangName = true
  ShowWordCount = true

  [params.homeInfoParams]
    Title = "Ghi chú & Nghiên cứu"
    Content = "Đây là nơi chia sẻ công khai một số ghi chú tri thức và nghiên cứu tổng hợp từ các nguồn có thẩm quyền. Nội dung mang tính tham khảo, không thay thế tư vấn chuyên môn."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/cyborgx0x"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Bài viết"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Chủ đề"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Tìm kiếm"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true
